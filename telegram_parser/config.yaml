name: Telegram Channel Parser
version: "1.0.3"
slug: telegram_channel_parser
description: Парсер Telegram-каналов
url: https://github.com/dvnua/ha-telegram-parser

arch:
  - aarch64

startup: application
boot: auto
init: false

ingress: true
ingress_port: 8099
panel_icon: mdi:telegram
panel_title: Telegram Parser

options:
  api_id: 0
  api_hash: ""
  bot_token: ""
  chat_id: 0
  channels: []
  keywords: []

schema:
  api_id: int
  api_hash: str
  bot_token: password
  chat_id: int
  channels:
    - str
  keywords:
    - str
